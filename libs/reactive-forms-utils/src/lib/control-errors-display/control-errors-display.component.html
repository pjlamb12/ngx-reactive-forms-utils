<div class="{{ containerClasses() }}">
	<ng-content></ng-content>

	@if (rulesBroken) {
		@if (errorsList(); as errors) {
			@if (errors && errors.length) {
				<div [id]="errorContainerId" [attr.aria-live]="ariaLive()">
					@for (error of errors; track error) {
						<p class="{{ errorClasses() }}" role="alert">{{ error }}</p>
					}
				</div>
			}
		}
	}
</div>
